name: Tauri Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish after all builds pass
        required: true
        default: 0.2.0
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: tauri-cross-platform-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Validate release version and source
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be semver like 0.2.0, got: $RELEASE_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists. Choose a new version." >&2
            exit 1
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Apple Silicon (arm64). NOTE: free macos-14 runners have only
          # ~7 GB RAM, and the embedded Next build needs a ~6-8 GB Node heap
          # (TAURI_NEXT_BUILD_HEAP_MB), so it may OOM here. For a reliable arm64
          # dashboard build, use a paid macos-14-xlarge runner; fail-fast:false
          # keeps the other legs running so the failure is fully diagnosed.
          - label: macOS Apple Silicon
            artifact_key: macos-arm64
            os: macos-14
            app_arch: -arm64
            bundle_glob: src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg
          - label: macOS Intel
            artifact_key: macos-x64
            os: macos-15-intel
            app_arch: -x64
            bundle_glob: src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows x64
            artifact_key: windows-x64
            os: windows-latest
            bundle_glob: src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux x64
            artifact_key: linux-x64
            os: ubuntu-22.04
            bundle_glob: src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/bump-app-version.mjs --set "$RELEASE_VERSION"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE is not set; macOS build will continue unsigned."
            exit 0
          fi
          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set." >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/hivemindos-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/hivemindos-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

      - name: Build Tauri app
        env:
          # macOS Developer ID code signing + notarization. These are read by
          # the Tauri bundler only on macOS (ignored on Windows/Linux). If the
          # secrets are unset the macOS build is simply unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Build the full embedded Next server (all API routes -> a working
          # dashboard) instead of the static export, which strips API routes.
          HIVEMINDOS_TAURI_EMBEDDED_NEXT: ${{ runner.os != 'Windows' && '1' || '' }}
          # Standard macOS runners need more time for embedded Next build traces
          # and signed/notarized packaging.
          TAURI_NEXT_BUILD_TIMEOUT_SECONDS: ${{ runner.os == 'macOS' && '3600' || '1800' }}
        run: pnpm tauri:build

      - name: Collect bundle assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for item in ${{ matrix.bundle_glob }}; do
            if [ -d "$item" ]; then
              base="$(basename "$item")"
              # Arch-tag the .app zip so Intel + arm64 macOS builds do not
              # overwrite each other. DMG names already carry arch.
              zipname="${base%.app}${{ matrix.app_arch }}.app.zip"
              ditto -c -k --keepParent "$item" "release-assets/${zipname}" 2>/dev/null || zip -r "release-assets/${zipname}" "$item"
            else
              cp "$item" release-assets/
            fi
          done
          for asset in release-assets/*; do
            case "$(basename "$asset")" in
              *_aarch64.dmg)
                cp "$asset" release-assets/HivemindOS-macos-aarch64.dmg
                ;;
              *_x64.dmg)
                cp "$asset" release-assets/HivemindOS-macos-x64.dmg
                ;;
              *-arm64.app.zip)
                cp "$asset" release-assets/HivemindOS-macos-arm64.app.zip
                ;;
              *-x64.app.zip)
                cp "$asset" release-assets/HivemindOS-macos-x64.app.zip
                ;;
              *_x64-setup.exe)
                cp "$asset" release-assets/HivemindOS-windows-x64-setup.exe
                ;;
              *_x64_en-US.msi)
                cp "$asset" release-assets/HivemindOS-windows-x64.msi
                ;;
              *_amd64.AppImage)
                cp "$asset" release-assets/HivemindOS-linux-x64.AppImage
                ;;
              *_amd64.deb)
                cp "$asset" release-assets/HivemindOS-linux-x64.deb
                ;;
              *-1.x86_64.rpm)
                cp "$asset" release-assets/HivemindOS-linux-x64.rpm
                ;;
            esac
          done
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "No bundle assets found for ${{ matrix.label }}." >&2
            find src-tauri/target/release/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi
          find release-assets -maxdepth 1 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_key }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be semver like 0.2.0, got: $RELEASE_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists. Choose a new version." >&2
            exit 1
          fi
          if gh release view "$release_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists. Choose a new version." >&2
            exit 1
          fi
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "No release assets downloaded." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" -m "HivemindOS ${release_tag}"
          git push origin "$release_tag"

          gh release create "$release_tag" release-assets/* \
            --repo "$REPOSITORY" \
            --title "$release_tag" \
            --generate-notes
