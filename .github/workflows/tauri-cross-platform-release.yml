name: Tauri Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish after all builds pass
        required: true
        default: 0.2.0
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: tauri-cross-platform-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Validate release version and source
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be semver like 0.2.0, got: $RELEASE_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists. Choose a new version." >&2
            exit 1
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release builds bundle the embedded Next standalone server
          # (HIVEMINDOS_TAURI_EMBEDDED_NEXT=1, set in the build step env) so the
          # packaged app actually serves /api/* at runtime. The static-only UI
          # shipped no API server, so the dashboard could never reach
          # /api/dashboard/state and hung on the loading screen. The embedded
          # `next build` traces ~155 API routes and needs ~8 GB heap; every
          # runner below has >=14 GB. The standard 7 GB macos-14 arm runner OOMs,
          # so Apple Silicon uses the larger macos-14-xlarge.
          - label: macOS Apple Silicon
            artifact_key: macos-arm64
            os: macos-14-xlarge
            app_arch: -arm64
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.app.tar.gz src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - label: macOS Intel
            artifact_key: macos-x64
            os: macos-15-intel
            app_arch: -x64
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.app.tar.gz src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - label: Windows x64
            artifact_key: windows-x64
            os: windows-latest
            bundle_glob: src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig
          - label: Linux x64
            artifact_key: linux-x64
            os: ubuntu-22.04
            bundle_glob: src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.AppImage.sig src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry/git AND the compiled src-tauri/target, so the
      # release build doesn't recompile every Tauri dependency crate from
      # scratch on each run (the dominant cost). Keyed on the Rust toolchain +
      # Cargo.lock; only the app crate itself recompiles after a version stamp.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              exit 0
            fi
            sleep_seconds=$((attempt * 15))
            echo "cargo fetch failed on attempt ${attempt}; retrying in ${sleep_seconds}s..." >&2
            sleep "$sleep_seconds"
          done
          cargo fetch --locked

      - name: Stamp release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/bump-app-version.mjs --set "$RELEASE_VERSION"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE is not set; macOS build will continue unsigned."
            exit 0
          fi
          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set." >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/hivemindos-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/hivemindos-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

      - name: Build Tauri app
        env:
          # macOS Developer ID code signing + notarization. These are read by
          # the Tauri bundler only on macOS (ignored on Windows/Linux). If the
          # secrets are unset the macOS build is simply unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artifact signing (createUpdaterArtifacts). The build fails
          # if this secret is unset — a release without signed updater
          # artifacts would silently strand existing installs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Bundle the embedded Next standalone server so the packaged app serves
          # /api/* at runtime (see the matrix comment). Without this the release
          # ships a static UI with no API server and the dashboard hangs on load.
          HIVEMINDOS_TAURI_EMBEDDED_NEXT: "1"
          # Embedded `next build` (155 API routes) is heavier than the old static
          # export, so allow more time for the UI build plus signed/notarized
          # packaging.
          TAURI_NEXT_BUILD_TIMEOUT_SECONDS: ${{ runner.os == 'macOS' && '3600' || '2700' }}
        run: pnpm tauri:build

      - name: Collect bundle assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for item in ${{ matrix.bundle_glob }}; do
            case "$(basename "$item")" in
              *_aarch64.dmg)
                cp "$item" release-assets/HivemindOS-macos-apple-silicon.dmg
                ;;
              *_x64.dmg)
                cp "$item" release-assets/HivemindOS-macos-intel.dmg
                ;;
              *.app.tar.gz)
                if [ "${{ matrix.app_arch }}" = "-arm64" ]; then
                  cp "$item" release-assets/HivemindOS-updater-macos-apple-silicon.app.tar.gz
                else
                  cp "$item" release-assets/HivemindOS-updater-macos-intel.app.tar.gz
                fi
                ;;
              *.app.tar.gz.sig)
                if [ "${{ matrix.app_arch }}" = "-arm64" ]; then
                  cp "$item" release-assets/HivemindOS-updater-macos-apple-silicon.app.tar.gz.sig
                else
                  cp "$item" release-assets/HivemindOS-updater-macos-intel.app.tar.gz.sig
                fi
                ;;
              *_x64-setup.exe)
                cp "$item" release-assets/HivemindOS-windows-x64-setup.exe
                ;;
              *_x64-setup.exe.sig)
                cp "$item" release-assets/HivemindOS-windows-x64-setup.exe.sig
                ;;
              *_x64_en-US.msi)
                cp "$item" release-assets/HivemindOS-windows-x64.msi
                ;;
              *_amd64.AppImage)
                cp "$item" release-assets/HivemindOS-linux-x64.AppImage
                ;;
              *_amd64.AppImage.sig)
                cp "$item" release-assets/HivemindOS-linux-x64.AppImage.sig
                ;;
              *_amd64.deb)
                cp "$item" release-assets/HivemindOS-linux-x64.deb
                ;;
              *-1.x86_64.rpm)
                cp "$item" release-assets/HivemindOS-linux-x64.rpm
                ;;
              *)
                echo "Skipping non-release bundle asset: $item"
                ;;
            esac
          done
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "No bundle assets found for ${{ matrix.label }}." >&2
            find src-tauri/target/release/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi
          find release-assets -maxdepth 1 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_key }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Build updater manifest
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --repo "$REPOSITORY" \
            --assets release-assets \
            --out release-assets/latest.json
          cat release-assets/latest.json

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"

          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be semver like 0.2.0, got: $RELEASE_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists. Choose a new version." >&2
            exit 1
          fi
          if gh release view "$release_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists. Choose a new version." >&2
            exit 1
          fi
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "No release assets downloaded." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" -m "HivemindOS ${release_tag}"
          git push origin "$release_tag"

          gh release create "$release_tag" release-assets/* \
            --repo "$REPOSITORY" \
            --title "$release_tag" \
            --generate-notes
