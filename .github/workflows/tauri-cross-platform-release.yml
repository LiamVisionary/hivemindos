name: Tauri Cross-Platform Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build from and upload assets to
        required: true
        default: v0.1.5

permissions:
  contents: write

concurrency:
  group: tauri-cross-platform-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-13
            bundle_glob: src-tauri/target/release/bundle/macos/*.app src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows x64
            os: windows-latest
            bundle_glob: src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux x64
            os: ubuntu-22.04
            bundle_glob: src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri:build

      - name: Collect bundle assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for item in ${{ matrix.bundle_glob }}; do
            if [ -d "$item" ]; then
              base="$(basename "$item")"
              ditto -c -k --keepParent "$item" "release-assets/${base}.zip" 2>/dev/null || zip -r "release-assets/${base}.zip" "$item"
            else
              cp "$item" release-assets/
            fi
          done
          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "No bundle assets found for ${{ matrix.label }}." >&2
            find src-tauri/target/release/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi
          find release-assets -maxdepth 1 -type f -print

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" --clobber
