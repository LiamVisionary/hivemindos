name: Windows Collector Smoke

# Confirms the agent telemetry collector (the local agent bridge a machine needs
# to host agents) actually boots and serves /health on Windows. Windows
# agent-hosting was never wired up (setup.ps1 installs no collector), so this is
# the free CI gate before building the Windows collector-install path.

on:
  push:
    branches:
      - ci/windows-collector-smoke
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to test
        required: false
        default: main

jobs:
  collector-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the collector's only third-party dep
        shell: pwsh
        run: npm install --no-save bonjour-service

      - name: Boot collector and probe /health on Windows
        shell: pwsh
        run: |
          $port = 8799
          $env:AGENT_TELEMETRY_PORT = "$port"
          $env:AGENT_TELEMETRY_HOST = "127.0.0.1"
          Write-Host "Booting agent-telemetry-collector.mjs on 127.0.0.1:$port ..."
          $proc = Start-Process -FilePath "node" `
            -ArgumentList "scripts/agent-telemetry-collector.mjs" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput "collector-out.log" `
            -RedirectStandardError "collector-err.log"
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            if ($proc.HasExited) { Write-Host "collector process exited early (exit code $($proc.ExitCode))"; break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 "http://127.0.0.1:$port/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Write-Host "=== collector stdout (tail 60) ==="
          if (Test-Path collector-out.log) { Get-Content collector-out.log -Tail 60 }
          Write-Host "=== collector stderr (tail 60) ==="
          if (Test-Path collector-err.log) { Get-Content collector-err.log -Tail 60 }
          if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            Write-Error "FAIL: collector /health did not respond 200 on Windows"
            exit 1
          }
          Write-Host "PASS: collector booted and /health responded 200 on Windows"

      - name: Validate install-telemetry-collector.ps1
        shell: pwsh
        run: |
          # Register WITHOUT starting via the logon task (the logon trigger can't
          # fire in CI), then drive the generated launcher directly to prove the
          # whole install chain works. Logon-firing + reboot persistence are left
          # for real-desktop E2E.
          & scripts/install-telemetry-collector.ps1 -Port 8801 -RepoRoot $PWD -NoStart

          $task = Get-ScheduledTask -TaskName "HivemindOS Telemetry Collector" -ErrorAction SilentlyContinue
          if (-not $task) { Write-Error "FAIL: scheduled task was not registered"; exit 1 }
          Write-Host "OK: scheduled task registered"

          $hive = Join-Path $env:USERPROFILE ".hivemindos"
          $envFile = Join-Path $hive "collector.env"
          $cmdFile = Join-Path $hive "run-collector.cmd"
          $vbsFile = Join-Path $hive "run-collector-hidden.vbs"
          foreach ($f in @($envFile, $cmdFile, $vbsFile)) {
            if (-not (Test-Path $f)) { Write-Error "FAIL: missing $f"; exit 1 }
          }
          $envText = Get-Content $envFile -Raw
          Write-Host "=== collector.env ==="; Write-Host $envText
          $resolvedPort = ($envText | Select-String 'AGENT_TELEMETRY_PORT=(\d+)').Matches.Groups[1].Value
          if (-not $resolvedPort) { Write-Error "FAIL: no AGENT_TELEMETRY_PORT in collector.env"; exit 1 }
          Write-Host "OK: collector.env + launcher + vbs written (port $resolvedPort)"

          Write-Host "Driving the generated launcher .cmd ..."
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","`"$cmdFile`"" `
            -PassThru -NoNewWindow -RedirectStandardOutput "inst-out.log" -RedirectStandardError "inst-err.log"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ($proc.HasExited) { Write-Host "launcher exited early (code $($proc.ExitCode))"; break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 "http://127.0.0.1:$resolvedPort/health"
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (Test-Path inst-err.log) { Write-Host "=== launcher stderr (tail 30) ==="; Get-Content inst-err.log -Tail 30 }
          if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName "HivemindOS Telemetry Collector" -Confirm:$false -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "FAIL: installer launcher -> collector -> /health did not respond on port $resolvedPort"; exit 1 }
          Write-Host "PASS: installer registers the logon task, writes collector.env + launcher, and the launcher boots the collector to /health 200"
