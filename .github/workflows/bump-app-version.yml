name: Suggest Next App Version

# Release versions should be minted by a successful desktop release, not by
# every push to main. This manual helper only prints the next patch candidate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suggest:
    name: Suggest next patch version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Print next version
        run: |
          version="$(node scripts/bump-app-version.mjs --next)"
          echo "Next patch candidate: v${version}"
