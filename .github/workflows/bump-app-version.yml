name: Tag App Version

# Tags each human push to main as the next patch release (vX.Y.Z) instead of
# committing version bumps back to main. main only moves when a person pushes,
# so local checkouts no longer go "stale" behind bot commits. The release build
# workflow injects the tag's version into package.json / tauri.conf.json /
# Cargo.toml at build time — the checked-in versions are just a floor.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-app-version-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag next patch version
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version bump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute next version
        id: next
        run: echo "version=$(node scripts/bump-app-version.mjs --next)" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "HivemindOS v${VERSION}"
          git push origin "v${VERSION}"
