name: Setup E2E Matrix

# End-to-end exercise of the first-run setup flow on all three desktop
# platforms. The unix job first runs the exact command line that the Tauri
# native_setup_run command generates for the "just this computer" option,
# then a full non-interactive run including the dashboard dev server.
on:
  push:
    branches: [test/setup-e2e-matrix]
  workflow_dispatch:

jobs:
  setup-unix:
    name: setup.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Run the command native_setup_run generates for "just this computer"
        run: |
          HIVE_MEMORY_IMPORTS='none' ./setup.sh '--interactive' '--local-only' '--skip-dashboard' '--import-skills=claude,codex' '--share-skills=all'

      - name: Run full non-interactive local setup including dashboard
        run: HIVE_MEMORY_IMPORTS='none' ./setup.sh --non-interactive --local-only

      - name: Verify dashboard dev server responds
        run: |
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5020/ || true)"
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "dashboard responded with HTTP $code"
              exit 0
            fi
            sleep 4
          done
          echo "dashboard did not respond on port 5020"
          tail -100 .next/hivemindos.log || true
          exit 1

  setup-windows:
    name: setup.ps1 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Run full non-interactive Windows setup
        shell: pwsh
        run: ./setup.ps1 -NonInteractive

      - name: Verify dashboard dev server responds
        shell: pwsh
        run: |
          $responded = $false
          foreach ($i in 1..90) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:5020/" -TimeoutSec 5
              Write-Host "dashboard responded with HTTP $($response.StatusCode)"
              $responded = $true
              break
            } catch {
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                Write-Host "dashboard responded with HTTP $([int]$_.Exception.Response.StatusCode)"
                $responded = $true
                break
              }
              Start-Sleep -Seconds 4
            }
          }
          if (-not $responded) {
            Get-Content .next/*.log -ErrorAction SilentlyContinue | Select-Object -Last 100
            throw "dashboard did not respond on port 5020"
          }
