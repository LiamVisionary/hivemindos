name: Debug Windows embedded server boot

# One-off diagnostic: reproduce the "HivemindOS couldn't start its local server"
# error reported on Windows by staging the EXACT embedded bundle the app ships
# (the shared ubuntu-built Next standalone + a Windows node.exe) and running
# server.js on windows-latest, capturing stdout/stderr so we see the real crash.
# Remove this workflow once the Windows boot failure is fixed.

on:
  workflow_dispatch:
    inputs:
      standalone_run_id:
        description: Run id that produced the next-standalone artifact to test
        required: true
        default: "27474308251"

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the shared Next standalone (same artifact shipped to Windows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.event.inputs.standalone_run_id }} -R ${{ github.repository }} -n next-standalone -D .next-tauri-build

      - name: Stage the embedded bundle exactly like the release build
        env:
          HIVEMINDOS_TAURI_EMBEDDED_NEXT: "1"
          HIVEMINDOS_TAURI_PREBUILT_STANDALONE: "1"
        run: node scripts/tauri-build.mjs

      - name: Reproduce the EISDIR-on-C crash and validate the fix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $node = (Resolve-Path "src-tauri/resources/hivemindos-node/node.exe").Path
          $absServer = (Resolve-Path "src-tauri/resources/hivemindos-next/server.js").Path
          # Tauri's resource_dir() hands Node a Windows extended-length (verbatim)
          # path like \\?\C:\...\server.js. Reproduce that exact form here.
          $verbatim = "\\?\" + $absServer
          $env:HOSTNAME = "127.0.0.1"; $env:NODE_ENV = "production"; $env:HIVEMINDOS_NATIVE = "1"

          function Try-Boot($label, $argList, $port) {
            Write-Host ""
            Write-Host ("===== CASE: {0} =====" -f $label)
            Write-Host ("  node $($argList -join ' ')")
            $env:PORT = "$port"
            $out = "out-$port.log"; $err = "err-$port.log"
            $p = Start-Process -FilePath $node -ArgumentList $argList -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -ge 200) { $ok = $true; break } } catch {}
              if ($p.HasExited) { break }
            }
            Write-Host ("  -> booted: {0} (exited early: {1})" -f $ok, $p.HasExited)
            if (Test-Path $err) { $e = Get-Content $err; if ($e) { Write-Host "  STDERR:"; $e | Select-Object -First 12 | ForEach-Object { Write-Host "    $_" } } }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            return $ok
          }

          $a = Try-Boot "A control: plain absolute path"               @($absServer) 5101
          $b = Try-Boot "B reproduce: verbatim \\?\ path (Tauri form)" @($verbatim) 5102
          $c = Try-Boot "C fix1: verbatim + --preserve-symlinks-main"  @("--preserve-symlinks-main", $verbatim) 5103
          $d = Try-Boot "D fix2: normalized abs + --preserve-symlinks-main" @("--preserve-symlinks-main", $absServer) 5104

          Write-Host ""
          Write-Host ("SUMMARY: A(plain)=$a  B(verbatim/repro)=$b  C(verbatim+flag)=$c  D(plain+flag)=$d")
          # The fix is validated if the verbatim form crashes (B=false) but the
          # flagged verbatim form boots (C=true). Fail the job only if the fix
          # candidate C did not boot.
          if (-not $c) { Write-Host "FIX CANDIDATE C FAILED"; exit 1 }
