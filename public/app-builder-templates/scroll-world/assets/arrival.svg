<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Arrival world</title>
  <desc id="description">An abstract teal world opening into a glowing route.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#1d2d34"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#9ff6df" stop-opacity=".78"/>
      <stop offset="1" stop-color="#6fcdba" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1210" cy="250" r="310" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M870 1000C800 760 900 600 1170 500s280-280 330-430" fill="none" stroke="#bdf9ea" stroke-opacity=".24" stroke-width="28"/>
  <g fill="#203c40" stroke="#6fcdba" stroke-opacity=".55" stroke-width="5">
    <path d="m970 610 150-88 150 88v175l-150 88-150-88z"/>
    <path d="m1110 245 108-64 108 64v126l-108 64-108-64z"/>
    <path d="m1320 510 75-44 75 44v88l-75 44-75-44z"/>
  </g>
  <g fill="#f8f1e4" fill-opacity=".7">
    <circle cx="1120" cy="697" r="15"/>
    <circle cx="1218" cy="308" r="12"/>
    <circle cx="1395" cy="554" r="10"/>
  </g>
</svg>
