<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-mono); padding: 20px; }
  .eyebrow { color: var(--honey); font-size: 10px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; }
  .metric { color: var(--accent-strong); font-size: 22px; font-weight: 600; margin-top: 10px; }
  .id { color: var(--fg-2); font-size: 12.5px; margin-top: 10px; }
  .meta { color: var(--fg-4); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin-top: 12px; }
</style>
</head>
<body>
  <div class="eyebrow">Local-first fleet manual</div>
  <div class="metric">CPU 38% · 22.3 / 36 GB</div>
  <div class="id">atlas.tail-fern.ts.net · 100.74.12.4 · v0.18.2</div>
  <div class="meta">JetBrains Mono · 400 / 500 / 600 / 700</div>
</body>
</html>
