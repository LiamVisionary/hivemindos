<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-body); padding: 20px; }
  .big { font-family: var(--font-display); font-weight: 700; color: var(--foreground); font-size: 44px; letter-spacing: 0; line-height: 0.98; }
  .big em { color: var(--honey); font-style: italic; font-weight: 500; }
  .sub { font-family: var(--font-display); font-weight: 600; color: var(--fg-2); font-size: 18px; margin-top: 14px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); letter-spacing: .06em; text-transform: uppercase; margin-top: 12px; }
</style>
</head>
<body>
  <div class="big">Private swarm <em>command</em></div>
  <div class="sub">Section title · Space Grotesk 600</div>
  <div class="meta">Space Grotesk · 500 / 600 / 700 · tracking 0 · line-height 0.98</div>
</body>
</html>
