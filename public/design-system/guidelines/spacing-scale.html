<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px-ish rhythm from 2 to 38px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-mono); padding: 20px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: grid; gap: 6px; justify-items: center; }
  .bar { background: var(--accent); border-radius: 3px; width: 100%; }
  .lab { color: var(--fg-3); font-size: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col" style="width:26px"><div class="bar" style="height:4px"></div><div class="lab">4</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:8px"></div><div class="lab">8</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:12px"></div><div class="lab">12</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:16px"></div><div class="lab">16</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:18px"></div><div class="lab">18</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:22px"></div><div class="lab">22</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:28px"></div><div class="lab">28</div></div>
    <div class="col" style="width:26px"><div class="bar" style="height:38px"></div><div class="lab">38</div></div>
  </div>
</body>
</html>
