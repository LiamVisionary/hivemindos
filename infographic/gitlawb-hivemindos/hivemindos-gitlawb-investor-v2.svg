<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HivemindOS x GitLawb simple investor infographic</title>
  <desc id="desc">A minimal investor infographic showing that HivemindOS private AI brain plus GitLawb signed code proof creates trusted autonomous software.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="58%" stop-color="#eefdf5"/>
      <stop offset="100%" stop-color="#fff8e8"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#092033" flood-opacity="0.13"/>
    </filter>
    <style>
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #082033; letter-spacing: 0; }
      .muted { fill: #486170; }
      .blue { fill: #0369a1; }
      .green { fill: #047857; }
      .gold { fill: #b7791f; }
      .light { fill: #f8fbff; }
      .softLight { fill: #dbeafe; }
      .cream { fill: #fef3c7; }
      .title { font-size: 76px; font-weight: 850; }
      .subtitle { font-size: 30px; font-weight: 600; }
      .cardTitle { font-size: 38px; font-weight: 850; }
      .body { font-size: 24px; font-weight: 570; }
      .symbol { font-size: 86px; font-weight: 850; fill: #123247; }
      .outcome { font-size: 28px; font-weight: 820; }
      .small { font-size: 18px; font-weight: 660; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text class="text title" x="96" y="110">HivemindOS x GitLawb</text>
  <text class="text subtitle muted" x="100" y="158">AI teams that remember their work and prove what shipped.</text>

  <g filter="url(#shadow)">
    <rect x="96" y="270" width="360" height="260" rx="34" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <text class="text cardTitle blue" x="136" y="346">Private AI</text>
    <text class="text cardTitle blue" x="136" y="394">Brain</text>
    <text class="text body muted" x="136" y="454">Projects, agents,</text>
    <text class="text body muted" x="136" y="486">machines, memory.</text>
  </g>

  <text class="text symbol" x="520" y="425">+</text>

  <g filter="url(#shadow)">
    <rect x="620" y="270" width="360" height="260" rx="34" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
    <text class="text cardTitle green" x="660" y="346">Signed Code</text>
    <text class="text cardTitle green" x="660" y="394">Proof</text>
    <text class="text body muted" x="660" y="454">Commits, repos,</text>
    <text class="text body muted" x="660" y="486">DIDs, provenance.</text>
  </g>

  <text class="text symbol" x="1046" y="425">=</text>

  <g filter="url(#shadow)">
    <rect x="1144" y="250" width="360" height="300" rx="38" fill="#092033" stroke="#fbbf24" stroke-width="3"/>
    <text class="text cardTitle cream" x="1184" y="334">Trusted</text>
    <text class="text cardTitle cream" x="1184" y="382">Autonomous</text>
    <text class="text cardTitle cream" x="1184" y="430">Software</text>
    <text class="text body softLight" x="1184" y="492">The story is clear.</text>
  </g>

  <rect x="170" y="620" width="1260" height="86" rx="43" fill="#082033" opacity="0.96"/>
  <text class="text outcome light" x="330" y="674">Remember the work</text>
  <text class="text outcome light" x="690" y="674">Prove the code</text>
  <text class="text outcome light" x="1016" y="674">Trust the result</text>

  <rect x="298" y="750" width="268" height="56" rx="28" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text class="text small blue" x="342" y="785">Private by default</text>

  <rect x="666" y="750" width="268" height="56" rx="28" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
  <text class="text small green" x="706" y="785">Proof-ready setup</text>

  <rect x="1034" y="750" width="292" height="56" rx="28" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text class="text small gold" x="1074" y="785">Node only when needed</text>
</svg>
