<!-- @dsCard group="Spacing" viewport="700x200" name="Radii & shadows" subtitle="Rounded 6–14px cells, deep soft shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-body); padding: 22px; }
  .row { display: flex; gap: 20px; align-items: center; }
  .box { width: 96px; height: 72px; background: var(--surface); border: 1px solid var(--hairline); display: grid; place-items: center; color: var(--fg-3); font-family: var(--font-mono); font-size: 10px; }
  .b1 { border-radius: var(--radius-sm); }
  .b2 { border-radius: var(--radius-md); }
  .b3 { border-radius: var(--radius-lg); }
  .sh { border-radius: var(--radius-sm); box-shadow: var(--shadow-card); }
  .name { color: var(--fg-4); font-family: var(--font-mono); font-size: 10px; margin-top: 8px; text-align: center; }
  .col { display: grid; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box b1">9px</div><div class="name">radius-sm</div></div>
    <div class="col"><div class="box b2">14px</div><div class="name">radius-md</div></div>
    <div class="col"><div class="box b3">20px</div><div class="name">radius-lg</div></div>
    <div class="col"><div class="box sh">shadow</div><div class="name">shadow-card</div></div>
  </div>
</body>
</html>
