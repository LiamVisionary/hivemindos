<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-body); }
  .row { display: flex; gap: 16px; padding: 22px; flex-wrap: wrap; }
  .col { display: grid; justify-items: center; gap: 8px; }
  .col img { width: 68px; height: 68px; object-fit: contain; }
  .queen img { width: 88px; height: 88px; }
  .lab { color: var(--fg-2); font-size: 11px; font-weight: 600; }
  .queen .lab { color: var(--honey); }
</style>
</head>
<body>
  <div class="row">
    <div class="col queen"><img src="../assets/bees/queen-bee.png" alt="Queen" /><div class="lab">Queen</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-code.png" alt="Coder" /><div class="lab">Coder</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-research.png" alt="Researcher" /><div class="lab">Research</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-planner.png" alt="Planner" /><div class="lab">Planner</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-qa.png" alt="QA" /><div class="lab">QA</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-ops.png" alt="Ops" /><div class="lab">Ops</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-security.png" alt="Security" /><div class="lab">Security</div></div>
    <div class="col"><img src="../assets/bees/worker-bee-writer.png" alt="Writer" /><div class="lab">Writer</div></div>
  </div>
</body>
</html>
