<!-- @dsCard group="Components" viewport="700x460" name="Feedback — Tooltip · Spinner · Skeleton · ProgressBar" subtitle="Loading states, meters, and hover tooltips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-body); color: var(--foreground); padding: 24px; }
  .grid { display: grid; gap: 22px; max-width: 640px; }
  .block { display: grid; gap: 12px; }
  .lab { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
  .row { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .sk-row { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .card { border: 1px solid var(--line-2); border-radius: var(--radius-md); background: var(--surface); padding: 16px; }
  .dotted { border-bottom: 1px dotted var(--fg-4); cursor: help; }
</style>
</head>
<body>
  <div id="root" class="grid"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" data-presets="react">
    const { Tooltip, Spinner, Skeleton, ProgressBar, Button } = window.HivemindOSDesignSystem_65eabf;

    function Demo() {
      return (
        <>
          <div className="block">
            <div className="lab">Tooltip — pair a plain meaning with a term</div>
            <div className="row">
              <Tooltip content="Where this agent receives and spends funds." side="top">
                <span className="dotted">Base wallet</span>
              </Tooltip>
              <Tooltip content="Read-only collector · no public port." side="right">
                <span className="dotted">Tailnet-only</span>
              </Tooltip>
            </div>
          </div>

          <div className="block">
            <div className="lab">Spinner — loading states</div>
            <div className="row">
              <Spinner />
              <Spinner tone="live" label="Verifying collector…" />
              <Button isLoading>Sending</Button>
            </div>
          </div>

          <div className="block">
            <div className="lab">ProgressBar — loading bars & meters</div>
            <div style={{display:'grid',gap:14,maxWidth:360}}>
              <ProgressBar value={62} label="Syncing vault" />
              <ProgressBar indeterminate tone="live" />
              <div style={{display:'grid',gap:8}}>
                <ProgressBar value={38} thickness={3} tone="honey" />
                <ProgressBar value={71} thickness={3} tone="honey" />
                <ProgressBar value={92} thickness={3} tone="danger" />
              </div>
            </div>
          </div>

          <div className="block">
            <div className="lab">Skeleton — shimmer placeholder (loading agent rows)</div>
            <div className="card">
              {[0,1,2].map((i) => (
                <div className="sk-row" key={i} style={{borderTop: i ? '1px solid var(--line)' : 'none'}}>
                  <Skeleton w={30} h={30} r={9} />
                  <div style={{flex:1,minWidth:0}}>
                    <Skeleton w="52%" h={11} />
                    <Skeleton w="34%" h={9} style={{marginTop:6}} />
                  </div>
                  <Skeleton w={64} h={20} r={99} />
                </div>
              ))}
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
