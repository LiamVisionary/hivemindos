<!-- @dsCard group="Components" viewport="700x600" name="Core primitives" subtitle="Button · Badge · Card · Checkbox · Segmented · StatusDot · CopyableCodeLine" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-body); color: var(--foreground); padding: 22px; }
  .grid { display: grid; gap: 20px; max-width: 660px; }
  .block { display: grid; gap: 10px; }
  .lab { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root" class="grid"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" data-presets="react">
    const NS = window.HivemindOSDesignSystem_65eabf;
    const { Button, Badge, Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter, Checkbox, StatusDot, CopyableCodeLine, Segmented } = NS;

    function Demo() {
      return (
        <>
          <div className="block">
            <div className="lab">Button — variants</div>
            <div className="row">
              <Button>Set up wallet</Button>
              <Button variant="secondary">Configure</Button>
              <Button variant="outline">Details</Button>
              <Button variant="ghost">Skip</Button>
              <Button variant="danger">Remove agent</Button>
              <Button variant="link">View logs</Button>
            </div>
            <div className="row">
              <Button size="xs">xs</Button>
              <Button size="sm">sm</Button>
              <Button size="default">default</Button>
              <Button size="lg">lg</Button>
              <Button isLoading>Working</Button>
              <Button disabled>Disabled</Button>
            </div>
          </div>

          <div className="block">
            <div className="lab">Badge · StatusDot</div>
            <div className="row">
              <Badge variant="success">Healthy</Badge>
              <Badge variant="warning">Needs funding</Badge>
              <Badge variant="danger">Requires approval</Badge>
              <Badge variant="honey">Queen</Badge>
              <Badge variant="secondary">Tailnet-only</Badge>
              <Badge variant="outline">Read-only</Badge>
            </div>
            <div className="row">
              <StatusDot tone="working" label="Working" />
              <StatusDot tone="healthy" label="Healthy" />
              <StatusDot tone="scheduled" label="Scheduled · 02:00 UTC" />
              <StatusDot tone="danger" label="Auth failed" />
            </div>
          </div>

          <div className="block">
            <div className="lab">Card · Checkbox</div>
            <div className="row" style={{alignItems:'stretch'}}>
              <Card style={{width:300}}>
                <CardHeader>
                  <CardTitle>atlas</CardTitle>
                  <CardDescription>macOS 15.3 · M3 Max · Brooklyn</CardDescription>
                </CardHeader>
                <CardContent style={{display:'flex',gap:8}}>
                  <StatusDot tone="working" label="3 agents · 2 working" />
                </CardContent>
                <CardFooter>
                  <Button size="sm">Open details</Button>
                  <Button size="sm" variant="outline">Shell</Button>
                </CardFooter>
              </Card>
              <div style={{display:'grid',gap:12,alignContent:'center'}}>
                <Checkbox defaultChecked label="Opt in to shared brain" />
                <Checkbox label="Require approval for spends" />
                <Checkbox defaultChecked label="Read-only collector" />
              </div>
            </div>
          </div>

          <div className="block">
            <div className="lab">Segmented — view / mode switch</div>
            <div className="row">
              <Segmented options={["Hive", "Graph", "Map", "List"]} defaultValue="Hive" />
              <Segmented variant="solid" options={[{value:"buy",label:"Buy"},{value:"sell",label:"Sell",tone:"sell"}]} defaultValue="buy" />
            </div>
          </div>

          <div className="block">
            <div className="lab">CopyableCodeLine — advanced surface</div>
            <CopyableCodeLine label="Add an API key" code="hive-env-add GOOGLE_API_KEY" />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
