<svg xmlns="http://www.w3.org/2000/svg" width="820" height="422" viewBox="0 0 820 422" role="img" aria-labelledby="chart-title chart-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="chart-title">Where Hive pulls ahead of Sibyl-Memory</title>
