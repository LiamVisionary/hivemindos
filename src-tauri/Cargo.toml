[package]
name = "hivemindos-desktop"
version = "0.2.3"
description = "HivemindOS desktop shell"
authors = ["HivemindOS"]
edition = "2021"

[lib]
name = "hivemindos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "HivemindOS"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2"

# Vendored inside src-tauri (not the repo-root vendor/) so the Go module's
# `go mod vendor` can never delete the patched crate.
[patch.crates-io]
tao = { path = "vendor/tao-0.35.3" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[lints.rust]
unsafe_code = "forbid"
