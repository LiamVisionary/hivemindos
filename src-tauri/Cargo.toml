[package]
name = "hivemindos-desktop"
version = "0.4.1"
description = "HivemindOS desktop shell"
authors = ["HivemindOS"]
edition = "2021"

[features]
default = []
link-app = []

[lib]
name = "hivemindos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "HivemindOS"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.2"
keyring = "=4.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-liquid-glass = "0.1.6"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2"
zeroize = { version = "1.8.2", features = ["derive"] }

# On-device speech recognition (macOS SFSpeechRecognizer, Windows WinRT)
# for free live voice captions — Queen voice works without an OpenAI key.
# The FFI is isolated in this path crate because the speech bindings need
# `unsafe` and this crate's lint forbids it; the sub-crate is the single
# audited unsafe boundary.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
hivemindos-speech-native = { path = "speech-native" }

# macOS LocalAuthentication (Touch ID) lives in a second focused path crate.
# Like speech-native, it isolates the audited Objective-C `unsafe` boundary
# from this parent crate, which forbids unsafe code.
[target.'cfg(target_os = "macos")'.dependencies]
hivemindos-biometric-native = { path = "biometric-native" }

# Vendored inside src-tauri (not the repo-root vendor/) so the Go module's
# `go mod vendor` can never delete the patched crate.
[patch.crates-io]
tao = { path = "vendor/tao-0.35.3" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Dev builds keep the app crate unoptimized for fast iteration, but optimize
# dependencies: wry runs invoke handling and response serialization on the
# UI-process main thread, and debug-mode serde_json/tauri/wry there made every
# dashboard interaction stall for seconds (WKWebView input + compositing wait
# on that same thread). One-time dependency rebuild cost, then cached.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
