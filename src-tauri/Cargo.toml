[package]
name = "hivemindos-desktop"
version = "0.1.0"
description = "HivemindOS desktop shell"
authors = ["HivemindOS"]
edition = "2021"

[lib]
name = "hivemindos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
