<!doctype html>
<!--
  HivemindOS embedded-build LOADING SHELL.

  This is the frontendDist index served by the Tauri "main" window the instant
  the app launches. In embedded mode the real UI is served by the bundled Node
  server, which takes ~1-3s to boot; the Rust setup() now spawns that server on a
  BACKGROUND thread and navigates this window to it when it is ready, so this
  shell paints immediately instead of a frozen blank window.

  While Node warms up, the shell calls the NATIVE Rust read commands (no server
  needed) to show live data — This Mac + tailnet machines — so first paint is
  real, not just a spinner. Everything degrades gracefully: if a native read is
  unavailable the stat is simply hidden and the branded loader still shows.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HivemindOS</title>
    <style>
      :root {
        --bg-0: #0a0b0f;
        --bg-1: #12141a;
        --honey: #ffb23e;
        --honey-dim: rgba(255, 178, 62, 0.18);
        --text: #e7e9ee;
        --muted: #8a8f98;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 120% at 50% 18%, var(--bg-1) 0%, var(--bg-0) 70%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      .stage {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
        text-align: center;
        animation: fade-in 420ms ease-out both;
      }
      @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      /* Honeycomb pulse */
      .hex {
        width: 84px;
        height: 96px;
        position: relative;
        filter: drop-shadow(0 6px 24px var(--honey-dim));
      }
      .hex svg { width: 100%; height: 100%; display: block; }
      .hex .ring {
        fill: none;
        stroke: var(--honey);
        stroke-width: 4;
        stroke-linejoin: round;
        opacity: 0.9;
        transform-origin: center;
        animation: breathe 1.8s ease-in-out infinite;
      }
      .hex .core {
        fill: var(--honey);
        opacity: 0.16;
        transform-origin: center;
        animation: core-pulse 1.8s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.92); opacity: 0.55; }
        50%      { transform: scale(1.0);  opacity: 1; }
      }
      @keyframes core-pulse {
        0%, 100% { opacity: 0.10; }
        50%      { opacity: 0.28; }
      }

      .wordmark {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .wordmark .os { color: var(--honey); }
      .status {
        font-size: 13.5px;
        color: var(--muted);
        min-height: 18px;
        letter-spacing: 0.2px;
      }

      .stats {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin-top: 4px;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 360ms ease, transform 360ms ease;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.02);
        overflow: hidden;
      }
      .stats.show { opacity: 1; transform: none; }
      .stat {
        padding: 10px 18px;
        min-width: 96px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .stat + .stat { border-left: 1px solid rgba(255, 255, 255, 0.06); }
      .stat .n { font-size: 18px; font-weight: 640; color: var(--text); }
      .stat .n .dot { color: var(--honey); }
      .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

      .track {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
        position: relative;
      }
      .track::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--honey), transparent);
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="hex" aria-hidden="true">
        <svg viewBox="0 0 86 98">
          <polygon class="core" points="43,4 81,26 81,72 43,94 5,72 5,26" />
          <polygon class="ring" points="43,4 81,26 81,72 43,94 5,72 5,26" />
        </svg>
      </div>
      <div class="wordmark">Hivemind<span class="os">OS</span></div>
      <div class="track" aria-hidden="true"></div>
      <div class="status" id="status">Waking the hive…</div>
      <div class="stats" id="stats"></div>
    </div>

    <script>
      (function () {
        "use strict";
        var invoke =
          (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) || null;
        var statusEl = document.getElementById("status");
        var statsEl = document.getElementById("stats");

        // Native reads only — no Node server needed. Never let one hang the shell.
        function callNative(cmd, args, timeoutMs) {
          if (!invoke) return Promise.resolve(null);
          var timed = new Promise(function (resolve) {
            setTimeout(function () { resolve(null); }, timeoutMs || 1500);
          });
          var call = invoke(cmd, args || {}).catch(function () { return null; });
          return Promise.race([call, timed]);
        }

        function addStat(value, label, accentDot) {
          var stat = document.createElement("div");
          stat.className = "stat";
          var n = document.createElement("div");
          n.className = "n";
          n.innerHTML =
            (accentDot ? '<span class="dot">●</span> ' : "") + String(value);
          var l = document.createElement("div");
          l.className = "l";
          l.textContent = label;
          stat.appendChild(n);
          stat.appendChild(l);
          statsEl.appendChild(stat);
          statsEl.classList.add("show");
        }

        function asArray(x) {
          return Array.isArray(x) ? x : [];
        }
        function isOnline(d) {
          if (!d || typeof d !== "object") return false;
          return d.online === true || d.Online === true || d.isOnline === true;
        }

        if (!invoke) {
          // No bridge (e.g. opened outside Tauri) — keep the branded loader only.
          return;
        }

        // This Mac (version) + tailnet machines. Both are pure local reads.
        Promise.allSettled([
          callNative("desktop_status", {}, 1200),
          callNative("tailscale_devices", {}, 1800),
        ]).then(function (results) {
          var status = results[0].value;
          var tailnet = results[1].value;

          if (tailnet && typeof tailnet === "object") {
            var devices = asArray(tailnet.devices);
            if (devices.length > 0) {
              var online = devices.filter(isOnline).length;
              addStat(online + "/" + devices.length, "Machines online", true);
            }
          }
          if (status && typeof status === "object" && status.version) {
            addStat("v" + status.version, "This Mac");
          }
          if (statsEl.children.length > 0) {
            statusEl.textContent = "Loading your hive…";
          }
        });
      })();
    </script>
  </body>
</html>
