<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HivemindOS</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        display: grid;
        gap: 0.75rem;
        text-align: center;
      }

      strong {
        font-size: 1rem;
        font-weight: 700;
      }

      span {
        color: #64748b;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Starting HivemindOS</strong>
      <span>Opening the local desktop runtime...</span>
    </main>
  </body>
</html>
