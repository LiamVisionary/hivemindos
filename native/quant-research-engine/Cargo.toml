[workspace]

[package]
name = "hivemind-quant-research-engine"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hivemind-quant-research-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
