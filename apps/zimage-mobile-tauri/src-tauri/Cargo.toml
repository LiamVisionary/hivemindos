[package]
name = "zimage-mobile-tauri"
version = "0.1.0"
description = "Native shell for Liam's private Z-Image Mobile Tailnet app"
authors = ["HivemindOS"]
edition = "2021"

[lib]
name = "zimage_mobile_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ZimageMobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
